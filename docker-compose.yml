services:
  auto-buaa:
    build: .
    image: auto-buaa:1.2.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:18346:18346"
    volumes:
      - buaa-profile:/data
    environment:
      TZ: Asia/Shanghai
      HEADLESS: "1"
      BUAA_ADMIN_PASSWORD: ${BUAA_ADMIN_PASSWORD:?Set a separate application management password}
      BUAA_ALLOWED_HOSTS: "127.0.0.1,localhost"
volumes:
  buaa-profile:
