services:
  auto-buaa:
    build: .
    image: auto-buaa:1.4.13
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18346:18346"
    volumes:
      - buaa-profile:/data
    environment:
      TZ: Asia/Shanghai
      HEADLESS: "1"
      BUAA_TD_DEVICE_FILE: /data/.td-device-id
      BUAA_ADMIN_PASSWORD: ${BUAA_ADMIN_PASSWORD:-}
      BUAA_ALLOWED_HOSTS: "127.0.0.1,localhost"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  buaa-profile:
