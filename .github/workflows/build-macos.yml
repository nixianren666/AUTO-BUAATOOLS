name: Native client verification and builds
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: Windows-x64
          - os: ubuntu-24.04
            platform: Linux-x86_64
          - os: macos-15
            platform: macOS-arm64
          - os: macos-15-intel
            platform: macOS-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BUAA_TEST_REPORT_DIR: ${{ github.workspace }}/acceptance/source
      BUAA_TEST_BROWSER: ""
      BUAA_NODE_MODULES: ${{ github.workspace }}/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements-build.txt
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Verify runtime and release version format
        run: python scripts/check_release_format.py
      - name: Linux native desktop and user-service environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libopengl0 libgl1 libpulse0 dbus-user-session libsecret-1-0
          python -m pip install 'pywebview[qt6]==6.2.1'
          npx playwright install-deps chromium
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          echo "PYWEBVIEW_GUI=qt" >> "$GITHUB_ENV"
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Source contracts and browser tests
        run: python scripts/test_isolated.py
      - name: Windows and macOS build and compiled acceptance
        if: runner.os != 'Linux'
        run: python scripts/build_release.py
      - name: Linux build and compiled desktop acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a python scripts/build_release.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.platform }}
          path: acceptance/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified fresh binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
# No automatic Release upload. Publication follows all native gates and computer-use.
