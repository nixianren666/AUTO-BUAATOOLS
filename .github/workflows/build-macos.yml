name: Build and Release macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            suffix: arm64
          - os: macos-13
            arch: x86_64
            suffix: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit test suite
        run: |
          python -m unittest discover -s tests

      - name: Build macOS .app with PyInstaller
        run: |
          pyinstaller --noconfirm BUAA-Signin-mac.spec

      - name: Execute live smoke test
        run: |
          PYTHONPATH=. python scripts/smoke_test_mac.py

      - name: Create DMG Disk Image and Zip Archive
        run: |
          # 1. Create elegant DMG with Applications symlink
          mkdir -p dist/dmg_root
          cp -R dist/BUAA-Signin.app dist/dmg_root/
          ln -s /Applications dist/dmg_root/Applications
          hdiutil create -volname "BUAA-Signin" -srcfolder dist/dmg_root -ov -format UDZO "dist/BUAA-Signin-macOS-${{ matrix.suffix }}.dmg"

          # 2. Also package zip for direct portability
          cd dist
          zip -r -y "BUAA-Signin-macOS-${{ matrix.suffix }}.zip" BUAA-Signin.app
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BUAA-Signin-macOS-${{ matrix.suffix }}
          path: |
            dist/BUAA-Signin-macOS-${{ matrix.suffix }}.dmg
            dist/BUAA-Signin-macOS-${{ matrix.suffix }}.zip

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" != v* ]]; then TAG="v1.2.2"; fi
          gh release view "$TAG" || gh release create "$TAG" --title "AUTO-BUAA $TAG" --notes "Release $TAG"
          gh release upload "$TAG" "dist/BUAA-Signin-macOS-${{ matrix.suffix }}.dmg" --clobber || true
          gh release upload "$TAG" "dist/BUAA-Signin-macOS-${{ matrix.suffix }}.zip" --clobber || true
